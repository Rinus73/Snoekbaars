<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1a16">
<title>Zander Weekoverzicht</title>
<style>
:root{--bg:#f2f5f3;--fg:#14211c;--mut:#5a6a63;--line:#d3dbd6;--card:#fff;--l:50%;--acc:#1f6f55}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a16;--fg:#e5eee9;--mut:#8fa199;--line:#25332d;--card:#16231e;--l:40%;--acc:#5cc5a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:18px 16px 40px}
main{max-width:720px;margin:0 auto}
h1{font-size:1.45rem;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 16px;font-size:.9rem}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px 8px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;font:inherit;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);font-weight:600}
.best{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:18px}
.best small{display:block;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;margin-bottom:2px}
.best .big{font-size:1.15rem;font-weight:600}
.best .why{color:var(--mut);font-size:.9rem}
.axis{display:flex;justify-content:space-between;color:var(--mut);font-size:.72rem;font-variant-numeric:tabular-nums;margin-bottom:2px}
.day{padding:9px 0;border-top:1px solid var(--line)}
.dayhead{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;font-variant-numeric:tabular-nums}
.dayhead .n{text-transform:capitalize}.dayhead .w{color:var(--mut)}.dayhead .w b{color:var(--fg)}
.strip{display:grid;grid-template-columns:repeat(24,1fr);gap:1px;height:34px}
.strip button{border:0;padding:0;margin:0;cursor:pointer;border-radius:0;outline-offset:1px}
.strip button.past{opacity:.3}
.strip button.sel{outline:2px solid var(--fg)}
.strip button.top{box-shadow:inset 0 -3px 0 var(--fg)}
.detail{min-height:3.2em;margin:14px 0 4px;padding:10px 12px;border-left:3px solid var(--acc);background:var(--card);font-size:.9rem}
.legend{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:.78rem;margin-top:14px}
.legend i{flex:0 0 120px;height:8px;background:linear-gradient(90deg,hsl(15 55% var(--l)),hsl(80 55% var(--l)),hsl(150 55% var(--l)))}
.note{color:var(--mut);font-size:.8rem;margin-top:10px}
.msg{padding:24px 0;color:var(--mut)}
.msg button{font:inherit;margin-top:8px;padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Zander, komende 7 dagen</h1>
  <p class="sub">Score per uur van 0 tot 100, op basis van luchtdruk, licht, wind, bewolking, regen en maan.</p>
  <div class="tabs" id="tabs" role="group" aria-label="Water"></div>
  <div id="out" aria-live="polite"><p class="msg">Verwachting laden…</p></div>
</main>

<script>
// Locaties: pas hier coordinaten aan of voeg water toe.
var PLEKKEN = [
  { naam: "IJssel bij Kampen", lat: 52.555, lon: 5.91 },
  { naam: "Gooimeer", lat: 52.30, lon: 5.18 }
];
var DAGEN = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
var MAANDEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
var WINDOW = 3;
var cur = 0, scored = [], nowT = null, wins = {};

function pad(n){ return n < 10 ? "0" + n : "" + n; }
function hm(d){ return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function dayKey(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function dayName(d){ return DAGEN[d.getDay()] + " " + d.getDate() + " " + MAANDEN[d.getMonth()]; }
function parse(s){ return new Date(s); } // lokale tijd Amsterdam als naive tijd, overal gelijk geparsed

function amsterdamNow(){
  var s = new Date().toLocaleString("sv-SE", { timeZone: "Europe/Amsterdam" }).replace(" ", "T");
  var d = new Date(s); d.setMinutes(0, 0, 0); return d;
}

function moonAge(d){
  var jd = d.getTime() / 86400000 + 2440587.5;
  return ((jd - 2451550.1) % 29.530588853 + 29.530588853) % 29.530588853;
}

function scoreHour(i, hours, sun){
  var h = hours[i], t = h.t;
  var dp = h.p - hours[Math.max(0, i - 6)].p, sp;
  if (dp >= -4 && dp <= -0.5) sp = 1; else if (dp > -0.5 && dp <= 1) sp = 0.7; else if (dp < -4) sp = 0.6; else sp = 0.3;

  var s = sun[dayKey(t)], rise = s[0], set = s[1];
  var dist = Math.min(Math.abs(t - rise), Math.abs(t - set)) / 3600000;
  var daylight = t >= rise && t <= set, sl;
  if (dist <= 1.5) sl = 1; else if (dist <= 3) sl = 0.65; else if (daylight) sl = 0.3; else sl = 0.45;

  var sc = daylight ? 0.4 + 0.6 * h.cloud / 100 : 0.8;

  var w = h.wind, sw;
  if (w >= 2 && w <= 6) sw = 1; else if (w >= 1.5 && w < 2) sw = 0.8; else if (w < 1.5) sw = 0.5; else if (w <= 9) sw = 0.5; else sw = 0.15;

  var sr = h.rain <= 0.5 ? 1 : h.rain <= 2 ? 0.7 : 0.4;

  var age = moonAge(t), m = Math.min(age, 29.53 - age, Math.abs(age - 14.77));
  var sm = m <= 2 ? 1 : 0.8;

  var total = 0.30*sp + 0.30*sl + 0.20*sw + 0.10*sc + 0.05*sr + 0.05*sm;
  return { s: Math.round(total * 100), dp: dp };
}

function load(){
  var p = PLEKKEN[cur];
  document.getElementById("out").innerHTML = '<p class="msg">Verwachting laden…</p>';
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + p.lat + "&longitude=" + p.lon +
    "&timezone=Europe%2FAmsterdam&forecast_days=7&wind_speed_unit=ms" +
    "&hourly=surface_pressure,cloud_cover,wind_speed_10m,precipitation&daily=sunrise,sunset";
  fetch(url).then(function(r){
    if (!r.ok) throw new Error("status " + r.status);
    return r.json();
  }).then(function(d){
    var h = d.hourly, hours = [], sun = {};
    for (var i = 0; i < h.time.length; i++){
      hours.push({ t: parse(h.time[i]), p: h.surface_pressure[i], cloud: h.cloud_cover[i], wind: h.wind_speed_10m[i], rain: h.precipitation[i] });
    }
    for (var j = 0; j < d.daily.time.length; j++){
      sun[d.daily.time[j]] = [parse(d.daily.sunrise[j]), parse(d.daily.sunset[j])];
    }
    nowT = amsterdamNow();
    scored = hours.map(function(x, i){
      var r = scoreHour(i, hours, sun);
      return { t: x.t, s: r.s, dp: r.dp, wind: x.wind, cloud: x.cloud, rain: x.rain, p: x.p };
    });
    wins = bestWindows();
    render();
  }).catch(function(){
    document.getElementById("out").innerHTML =
      '<div class="msg">De verwachting kon niet worden opgehaald. Controleer je verbinding.<br><button id="retry">Opnieuw proberen</button></div>';
    document.getElementById("retry").onclick = load;
  });
}

function bestWindows(){
  var out = {};
  for (var i = 0; i <= scored.length - WINDOW; i++){
    var st = scored[i].t;
    if (st < nowT) continue;
    var sum = 0; for (var k = 0; k < WINDOW; k++) sum += scored[i + k].s;
    var avg = Math.round(sum / WINDOW), key = dayKey(st);
    if (!out[key] || avg > out[key].s) out[key] = { s: avg, i: i };
  }
  return out;
}

function hue(s){ return Math.round(15 + 135 * s / 100); }

function why(x){
  var bits = [];
  if (x.dp < -0.5) bits.push("luchtdruk daalt " + Math.abs(x.dp).toFixed(1) + " hPa in 6 uur");
  else if (x.dp <= 1) bits.push("luchtdruk stabiel");
  else bits.push("luchtdruk stijgt " + x.dp.toFixed(1) + " hPa in 6 uur");
  bits.push("wind " + x.wind.toFixed(1) + " m/s");
  bits.push("bewolking " + Math.round(x.cloud) + "%");
  bits.push("regen " + x.rain.toFixed(1) + " mm");
  return bits.join(", ");
}

function detailText(i){
  var x = scored[i];
  return "<b>" + dayName(x.t) + " " + hm(x.t) + "</b>, score " + x.s + "<br>" + why(x);
}

function render(){
  var keys = Object.keys(wins).sort(), top = null;
  keys.forEach(function(k){ if (!top || wins[k].s > wins[top].s) top = k; });
  var html = "";
  if (top){
    var tw = wins[top], ts = scored[tw.i].t, te = new Date(ts.getTime() + WINDOW * 3600000);
    html += '<div class="best"><small>Beste moment van de week</small><div class="big">' +
      dayName(ts) + ", " + hm(ts) + "-" + hm(te) + ", score " + tw.s + '</div><div class="why">' + why(scored[tw.i]) + "</div></div>";
  }
  html += '<div class="axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>';
  var days = {}, order = [];
  scored.forEach(function(x, i){
    var k = dayKey(x.t);
    if (!days[k]){ days[k] = []; order.push(k); }
    days[k].push(i);
  });
  order.forEach(function(k){
    var idx = days[k], first = scored[idx[0]].t, w = wins[k];
    var wtxt = w ? hm(scored[w.i].t) + "-" + hm(new Date(scored[w.i].t.getTime() + WINDOW * 3600000)) + " <b>" + w.s + "</b>" : "voorbij";
    html += '<div class="day"><div class="dayhead"><span class="n">' + dayName(first) + '</span><span class="w">' + wtxt + '</span></div><div class="strip">';
    idx.forEach(function(i){
      var x = scored[i];
      var cls = (x.t < nowT ? "past " : "") + (w && i >= w.i && i < w.i + WINDOW ? "top" : "");
      html += '<button type="button" data-i="' + i + '" class="' + cls + '" style="background:hsl(' + hue(x.s) + ' 55% var(--l))" aria-label="' + hm(x.t) + ' score ' + x.s + '"></button>';
    });
    html += "</div></div>";
  });
  html += '<div class="detail" id="detail">Tik op een uur voor de details.</div>';
  html += '<div class="legend">laag<i></i>hoog <span>(streep onderaan = beste venster van 3 uur)</span></div>';
  html += '<p class="note">Gegevens: Open-Meteo. De score is een inschatting op basis van algemene zanderkennis, geen garantie.</p>';
  var out = document.getElementById("out");
  out.innerHTML = html;
  out.onclick = function(e){
    var b = e.target.closest ? e.target.closest("button[data-i]") : null;
    if (!b) return;
    var prev = out.querySelector(".sel"); if (prev) prev.classList.remove("sel");
    b.classList.add("sel");
    document.getElementById("detail").innerHTML = detailText(+b.getAttribute("data-i"));
  };
}

function buildTabs(){
  var el = document.getElementById("tabs"); el.innerHTML = "";
  PLEKKEN.forEach(function(p, i){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = p.naam; b.setAttribute("aria-pressed", i === cur ? "true" : "false");
    b.onclick = function(){
      cur = i;
      try { localStorage.setItem("zander-plek", String(i)); } catch (e) {}
      buildTabs(); load();
    };
    el.appendChild(b);
  });
}

try { var o = parseInt(localStorage.getItem("zander-plek"), 10); if (o >= 0 && o < PLEKKEN.length) cur = o; } catch (e) {}
buildTabs();
load();
</script>
</body>
</html>
